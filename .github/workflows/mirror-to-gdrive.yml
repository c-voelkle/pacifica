name: Pacifica — mirror to Google Drive

# Copies the pushed branch to Google Drive as Pacifica-Mirror/<branch>, with
# "/" in the branch name replaced by "-". One-way: Drive is a read-only copy,
# and files deleted in the repository are deleted in the mirror.
#
# Needs the repository secret RCLONE_CONF: the contents of an rclone.conf with
# a Google Drive remote named "gdrive". Until the secret exists the job skips.

on:
  push:
    branches:
      - main
      - "drafts/**"
      - "draft/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdrive-mirror-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
    steps:
      - name: Check for the rclone secret
        id: secret
        run: |
          if [ -n "$RCLONE_CONF" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RCLONE_CONF is not set; nothing mirrored."
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.present == 'true'
        with:
          persist-credentials: false

      - name: Install rclone
        if: steps.secret.outputs.present == 'true'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Mirror the branch
        if: steps.secret.outputs.present == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
        run: |
          umask 077
          printf '%s\n' "$RCLONE_CONF" > "$RCLONE_CONFIG"
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          rclone sync . "gdrive:Pacifica-Mirror/${SAFE_BRANCH}" \
            --exclude "/.git/**" \
            --exclude "/.github/**" \
            --exclude "__pycache__/**" \
            --fast-list \
            --transfers 8
          rm -f "$RCLONE_CONFIG"
