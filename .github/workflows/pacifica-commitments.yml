name: Pacifica — commitments ledger

on:
  pull_request:
    paths:
      # Canon files, the same list in the storyline, commitments and characters workflows,
      # so an integration PR always runs all three together.
      - "book-agent/revision/change_requests.json"
      - "book-agent/revision/master_storyline.md"
      - "book-agent/revision/approved_change_index.md"
      - "book-agent/revision/canon_facts.toml"
      - "book-agent/revision/character_bible.md"
      - "book-agent/revision/character_registry.json"
      - "book-agent/revision/legacy_character_crosswalk.json"
      - "book-agent/character_bible.json"
      - "commitments/**"
      - "AGENTS.md"
      # This workflow's own tools.
      - ".github/workflows/pacifica-commitments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every ledger entry against the storyline
        run: python commitments/ledger.py check
      - name: Test the ledger
        run: python -m unittest discover -s commitments/tests -v
