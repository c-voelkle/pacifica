name: Pacifica — population model

on:
  pull_request:
    paths:
      - "population/**"
      - "finance/Pacifica_financial_model_1846-1932.xlsx"
      - ".github/workflows/pacifica-population.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl==3.1.5
      - name: Test the population model
        run: python -m unittest discover -s population/tests -v
