name: Pacifica — validate revision canon

on:
  pull_request:
    paths:
      - "book-agent/revision/change_requests.json"
      - "book-agent/revision/master_storyline.md"
      - "book-agent/revision/approved_change_index.md"
      - "book-agent/revision/sync_master_storyline.py"
      - "book-agent/revision/character_bible.md"
      - "book-agent/revision/character_registry.json"
      - "book-agent/revision/canon_facts.toml"
      - "book-agent/revision/lint_canon.py"
      - "book-agent/revision/cr_facts.py"
      - "book-agent/revision/tests/**"
      - "AGENTS.md"
      - ".github/workflows/pacifica-storyline-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-canonical-storyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approval index and narrative coverage
        run: python3 book-agent/revision/sync_master_storyline.py --check
      - name: Lint dates, ages, IDs and forbidden statements against canon_facts.toml
        run: python3 book-agent/revision/lint_canon.py
      - name: Check that approved CR fact changes are in canon_facts.toml
        run: python3 book-agent/revision/cr_facts.py check
      - name: Test the canon linter
        run: python3 -m unittest discover -s book-agent/revision/tests -v
