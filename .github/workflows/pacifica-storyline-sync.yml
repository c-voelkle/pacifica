name: Pacifica — sync master storyline

on:
  push:
    paths:
      - "book-agent/revision/change_requests.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-approval-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Regenerate canonical approvals in the master storyline
        run: python3 book-agent/revision/sync_master_storyline.py --write
      - name: Commit synchronized document when required
        run: |
          if ! git diff --quiet -- book-agent/revision/master_storyline.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add book-agent/revision/master_storyline.md
            git commit -m "Sync master storyline with approved change register"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
