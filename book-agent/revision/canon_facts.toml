# ---------------------------------------------------------------------------
# Dated events
# Each pattern is a regular expression with a named group `year`; every match
# in canon or a draft must state `year`. Write patterns tight enough that they
# only match statements of this event.
# ---------------------------------------------------------------------------

[[event]]
id = "noe-typhoid-death"
year_from = "CT-JULIAN-MOTHER.died"   # follows Noe's entry above: change the date there
patterns = ['dies (?:in |during )?(?:the )?(?:(?:spring|summer|autumn|fall|winter) (?:of )?)?(?P<year>1[89]\d\d) during (?:a|the) typhoid', 'typhoid (?:outbreak|epidemic) of (?P<year>1[89]\d\d)', '(?P<year>1[89]\d\d) typhoid (?:outbreak|death|epidemic)']
source = "CR-021 F1"

[[event]]
id = "hanai-adoption"
year = 1886
patterns = ['(?P<year>1[89]\d\d) hānai (?:bargain|adoption)', 'hānai (?:bargain|adoption) (?:is made |was made )?in (?P<year>1[89]\d\d)', 'adopted hānai in (?P<year>1[89]\d\d)']
source = "AGENTS.md; CR-021 F1"

[[event]]
id = "victoria-queen"
year = 1872
patterns = ['Queen of Hawaii from (?:[A-Z][a-z]+ )?(?P<year>1[89]\d\d)']
source = "AGENTS.md"

[[event]]
id = "victoria-regent"
year = 1887
patterns = ['Regent of (?:Pacifica|the Realm) from (?:[A-Z][a-z]+ )?(?P<year>1[89]\d\d)', 'becomes [Rr]egent in (?P<year>1[89]\d\d)']
source = "AGENTS.md"

[[event]]
id = "julian-accession"
year = 1907
patterns = ['''Julian accedes (?:to [^.;]{0,30} )?in (?P<year>1[89]\d\d)''', '''Julian(?:'s|’s) accession in (?P<year>1[89]\d\d)''', '''Julian succeeds (?:Victoria|her) (?:directly )?in (?P<year>1[89]\d\d)''', '''hands power directly to Julian in (?P<year>1[89]\d\d)''', '''In (?P<year>1[89]\d\d) Victoria lays down both the regency''']
source = "AGENTS.md; CR-040"

[[event]]
id = "office-public-measures"
year = 1888
patterns = ['Office of Public Measures,? (?:is )?(?:established|founded|created) in (?P<year>1[89]\d\d)']
source = "master_storyline.md §21"

[[event]]
id = "hollerith-tabulation"
year = 1888
patterns = ['(?:tabulate|tabulates|tabulating|tabulation of)[^.;]{0,40}registers,? (?:from|in|beginning in|starting in) (?P<year>1[89]\d\d)', 'registers (?:are )?tabulated (?:from|in) (?P<year>1[89]\d\d)']
source = "master_storyline.md §24; character_bible.md CT-HOLLERITH (PROPOSED — CR-027)"

[[event]]
id = "donner-standoff"
year = 1887
patterns = ['standoff at Donner(?: Pass)? in (?:[A-Z][a-z]+ )?(?P<year>1[89]\d\d)']
source = "CR-022"

# ---------------------------------------------------------------------------
# Forbidden statements in current canon and drafts
# Regular expressions, matched case-insensitively within one sentence.
# kind = "intent" for the protected intent in AGENTS.md; kind = "fact" for
# plot decisions and identity distinctions a CR made, revisable by a later CR.
# ---------------------------------------------------------------------------

[[forbidden]]
kind = "fact"
pattern = "Emma's son Albert|Albert Kūnuiākea,? Emma's son"
message = "Albert Kūnuiākea is Emma's cousin and heir, not her son (CR-027)"

[[forbidden]]
kind = "intent"
pattern = "(?:on|by) (?:the )?(?:instructions?|orders?) (?:from|of) (?:the palace|Victoria|the Regent)"
message = "Narrator-level instruction from Victoria's side implicates a suspect in Noe's death; the culprit stays unproved (CR-021 R9-09)"

[[forbidden]]
kind = "intent"
pattern = "(?:Victoria|the Regent|Silas|Abigail) (?:had|has) (?:Noe|her) (?:poisoned|killed|murdered)"
message = "States a culprit for Noe's death; the culprit stays unproved (CR-021 R9-09)"

[[forbidden]]
kind = "intent"
pattern = "(?:murderer|killer) of (?:Noe|Kaʻanoe)|(?:Noe|Kaʻanoe)'s (?:murderer|killer) (?:was|is)"
message = "Establishes a murderer for Noe; never establish one (AGENTS.md)"

[[forbidden]]
kind = "intent"
pattern = "President Julian|Julian,? (?:the )?President"
message = "Julian is never President (AGENTS.md)"

[[forbidden]]
kind = "intent"
pattern = "throne (?:falls )?(?:into|in) abeyance"
message = "There is no Hawaiian throne abeyance (AGENTS.md)"

[[forbidden]]
kind = "intent"
pattern = '''(?<!\bto )\b(?:wage|wages|waged|declare|declares|declared|order|orders|ordered|launch|launches|launched) (?:a |its |their )?(?:war|campaign) of extermination|(?:war|campaign) of extermination (?:is|was) (?:waged|declared|ordered|launched)'''
message = "Pacifica wages no campaign of extermination (CR-033)"
source = "CR-033"

[[event]]
id = "mokelumne-gold-find"
year = 1847
patterns = ['''In (?:October )?(?P<year>1[89]\d\d),[^.;]{0,200}find coarse gold''', '''(?:October )?(?P<year>1[89]\d\d) gold (?:discovery|find)''']
source = "CR-034"

[[event]]
id = "californium-discovery"
