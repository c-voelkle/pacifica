# Pacifica canon facts — single source of truth for dates, ages and identities
#
# `lint_canon.py` checks the storyline, character bible, registry, AGENTS.md
# and any draft you pass it against these facts. When the author approves a
# change to a date here, edit it here first: the linter then lists every
# passage that still states the old value.
#
# Only record facts the current canon approves (cite the CR in `source`).
# Approximate dates ("c.1860") use `approx = true` and get a wider tolerance.
# `aliases` are the names prose uses for the person; the first is the label
# used in reports. Keep aliases specific: a bare "Silas" would match two people.

# ---------------------------------------------------------------------------
# People
# ---------------------------------------------------------------------------

[[person]]
id = "CT-ELIAS"
aliases = ["Elias Thorne", "Elias", "the founder"]
