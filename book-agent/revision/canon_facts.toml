# Pacifica canon facts — single source of truth for dates, ages and identities
#
# `lint_canon.py` checks the storyline, character bible, registry, AGENTS.md
# and any draft you pass it against these facts. When the author approves a
# change to a date here, edit it here first: the linter then lists every
# passage that still states the old value.
#
# Only record facts the current canon approves (cite the CR in `source`).
# Approximate dates ("c.1860") use `approx = true` and get a wider tolerance.
# `aliases` are the names prose uses for the person; the first is the label
# used in reports. Keep aliases specific: a bare "Silas" would match two people.
#
# Everything here records what canon currently says, not what it must say.
# Any entry can change through a CR when the story is better for it; a fact
# being older is no reason to keep it (docs/authority-and-scope.md R8).
#
# `[[forbidden]]` entries carry a `kind`:
#   kind = "intent" — a value of the book the author has protected (Noe's
#                     culprit stays unproved; Julian is never President).
#                     Changing one is an explicit author decision, retired
#                     with {"retire_intent": {"pattern": "…"}}.
#   kind = "fact"   — a plot decision some CR made, written as a pattern so
#                     prose cannot contradict it silently. The linter reports
#                     a hit as a departure from canon, to be resolved either
#                     way: revise the passage, or retire the entry in a CR with
#                     {"retire_forbidden": {"pattern": "…"}}. New entries
#                     default to "fact".

