# Pacifica commitments ledger — political obligations kept like a debt register.
#
# Rules
# - Record only what the storyline states. `quote` is copied verbatim from
#   book-agent/revision/master_storyline.md (whitespace and curly quotes are
#   normalised); `ledger.py check` fails if it is not there. Use `more_quotes`
#   for further passages that state terms (renewals, ends, conditions).
# - `status` is the storyline's label at the quote: CANON (unlabelled base text),
#   APPROVED, PROPOSED, OPEN or MODEL. The checker compares it with the label in
#   force at the quote (the last label before it in the same paragraph). Where
#   that label's scope is misleading, keep the true status and say why in `label_note`.
# - Never fill a gap: leave `until`, `renewals` or `can_end` out when canon does
#   not state them, and note the gap in `open` instead.
#
# Fields of [[commitment]]
#   id            "C-<year>-<SHORT>"
#   name          as canon names it
#   kind          treaty | convention | compact | lease | loan | guarantee | office |
#                 charter | law | constitution | pact | concession | settlement | alliance
#   parties       party ids (declared below)
#   from          first year in force
#   from_approx   true when canon gives no year and `from` is the year of the passage that
#                 first states the commitment (say so in `open`)
#   until         last year of a fixed term (term end), if canon states one
#   term_years    the stated term, if any (must equal until − from)
#   renewals      scheduled renewal or review years stated in canon
#   ended         year canon ends it early, and `ended_by` (short text)
#   lapses_on_death  person ids (canon_facts.toml or [[person]] below) whose death ends it
#   holder        person id holding a life office or personal grant
#   owes          [{by, to, what}]: who owes what to whom
#   secured_on    for loans: the pledged revenues
#   can_end       [{who, how}]: who can refuse, revoke, withdraw or must consent
#   conditions    conditions stated in canon
#   status, cr, section, quote, more_quotes, label_note, open

