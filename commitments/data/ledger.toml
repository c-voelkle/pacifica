# ---------------------------------------------------------------------------
# Commitments (worked examples; the rest follow)
# ---------------------------------------------------------------------------

[[commitment]]
id = "C-1874-PUULOA"
name = "Puʻuloa Convention"
kind = "lease"
parties = ["HI", "PAC"]
from = 1874
until = 1924
term_years = 50
owes = [
  { by = "HI", to = "PAC", what = "lease of Pearl Harbor and its shores; no Hawaiian land alienated" },
  { by = "PAC", to = "HI", what = "common defence" },
]
can_end = [{ who = "HI", how = "the legislature ratified it narrowly; a lease, not a cession" }]
status = "APPROVED"
cr = "CR-027"
section = 17
quote = "In March 1874 she signs the Puʻuloa Convention: a fifty-year lease of Pearl Harbor and its shores to the Confederation and a treaty of common defence. It is a lease, not a cession; no Hawaiian land is alienated."
open = "What happens at the 1924 term end is not stated in this entry's quote."

[[commitment]]
id = "C-1876-PH-LOAN"
name = "Philippine Redemption Loan"
kind = "loan"
parties = ["PAC", "PH", "LONDON"]
from = 1876
owes = [
  { by = "PH", to = "LONDON", what = "service of the loan from the Philippine customs" },
  { by = "PAC", to = "LONDON", what = "the Confederation's guarantee" },
  { by = "PAC", to = "PH", what = "service limited to the gain the islands make over their last Spanish years, published every year" },
]
secured_on = "Philippine customs"
status = "APPROVED"
cr = "CR-029"
section = 15
quote = "A Philippine Redemption Loan, guaranteed by the Confederation and serviced from the Philippine customs, raises the price in London and San Francisco, and a covenant limits its service to the gain the islands make over their last Spanish years, published every year."
open = "Term and final maturity not stated."
