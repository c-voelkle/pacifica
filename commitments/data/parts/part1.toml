[[commitment]]
id = "C-1847-QUERETARO"
name = "Convention of Querétaro"
kind = "convention"
parties = ["MX", "PAC", "LONDON"]
from = 1847
owes = [
  { by = "MX", to = "PAC", what = "recognition of California" },
  { by = "PAC", to = "MX", what = "assumption of about £3 million of Mexican obligations to London bondholders (see C-1847-LONDON-DEBT)" },
  { by = "PAC", to = "MX", what = "guarantee of Mexican citizens' property and the Church's" },
  { by = "PAC", to = "MX", what = "pledge never to cede itself or its territory to any power" },
]
can_end = [{ who = "LONDON", how = "the bondholders' consent is sought (Hartnell carries the convention to London)" }]
status = "PROPOSED"
cr = "CR-028"
section = 4
quote = "In the **Convention of Querétaro** of December 1847, Mexico recognizes California."
more_quotes = [
  "The convention also guarantees Mexican citizens' property and the Church's, and pledges never to cede itself or its territory to any power.",
  "William Hartnell carries the convention to London for the bondholders' consent.",
  "Buchanan asks for an accession clause, and Vallejo refuses, citing Querétaro.",
]
open = "Whether and when the bondholders consent is not stated. No term; the non-cession pledge is unlimited in time. How the 1856 Confederation squares with 'never to cede itself' is not addressed."

[[commitment]]
id = "C-1847-LONDON-DEBT"
name = "Assumed Mexican debt to the London bondholders"
kind = "loan"
parties = ["PAC", "LONDON", "MX"]
from = 1847
owes = [
  { by = "PAC", to = "LONDON", what = "service of about £3 million of Mexican obligations assumed under Querétaro" },
]
secured_on = "customs and prospective mining revenue (later stated as gold royalties and San Francisco customs)"
conditions = ["the bonds of Mexico's 1846 conversion carry no land rights; California buys no territory from them"]
can_end = [{ who = "LONDON", how = "the bondholders' consent to the convention is sought" }]
status = "PROPOSED"
cr = "CR-028"
section = 4
quote = "In return California assumes approximately **£3 million of Mexican obligations to London bondholders**, secured against customs and prospective mining revenue."
more_quotes = [
  "Elias pledges royalties from a find that only five people in the world know of, and he says nothing false: the mines, he tells the Mexican foreign minister, are California's hope.",
  "The precise valuation, creditor arrangements and amortization remain matters of financial modeling.",
  "The republic's mining revenue finances infrastructure, but its debt to London remains. British bondholders hold claims secured by gold royalties and San Francisco customs.",
  "Britain refuses to support a war of Californian expansion, and the London bondholders warn that their credit was not extended to finance such adventures.",
]
open = "Valuation, interest, amortization and maturity not stated (left to financial modelling)."

