[[commitment]]
id = "C-1846-FOUNDING"
name = "Founding settlement of the República de California"
kind = "constitution"
parties = ["PAC"]
from = 1846
conditions = [
  "English and Spanish have constitutional standing in legislation, courts and public administration",
  "citizenship and eligibility for civil employment rest on defined civic qualifications, not language, ancestry or conversion",
  "religious liberty protects public worship alongside Catholic institutions",
  "bill of rights: representative government, jury trial, habeas corpus, due process, protection against arbitrary seizure",
  "existing laws continue where consistent: prohibition of slavery, vested property rights, mining rules (the 1783 Mining Ordinances)",
]
status = "CANON"
section = 4
quote = "The founding settlement gives English and Spanish constitutional standing in legislation, courts and public administration."
more_quotes = [
  "A bill of rights guarantees representative government, jury trial, habeas corpus, due process and protection against arbitrary seizure.",
  "Existing laws continue where consistent with that settlement, including the prohibition of slavery, vested property rights and mining rules awaiting legislative adaptation.",
  "The republic publicly administers claims under laws inherited from the Spanish and Mexican mining regime, including the 1783 Mining Ordinances, continued in force by the founding constitution.",
]
open = "Exact franchise and naturalization rules are **[OPEN]** in canon; amendment procedure not stated. Replaced or revised by the 1852 Monterey convention to an extent not stated."

[[commitment]]
id = "C-1846-SOLANO"
name = "Separate compact with Solano (Sem-Yeto)"
kind = "compact"
parties = ["PAC", "SUISUN"]
from = 1846
status = "CANON"
section = 4
quote = "Solano signs or marks a separate compact as an allied chief rather than acquiring a fictitious mandate to speak for every Indigenous people."
more_quotes = [
  "Sem-Yeto, known as Solano, negotiates on behalf of Suisun interests that include recognition of territorial and political authority, not ceremonial admission to a settler republic.",
]
open = "Terms of the compact are not stated; §3 states only what Solano sought (recognition of territorial and political authority). Duration and end not stated."

[[commitment]]
id = "C-1846-STANDSTILL"
name = "Naval standstill with Stockton"
kind = "convention"
parties = ["PAC", "US"]
from = 1846
owes = [
  { by = "PAC", to = "US", what = "American vessels may provision in Californian ports for operations against Mexico" },
  { by = "US", to = "PAC", what = "American vessels may not seize Californian ports" },
]
status = "CANON"
section = 4
quote = "When Robert F. Stockton replaces Sloat, Elias helps negotiate a naval standstill. American vessels may provision in Californian ports for operations against Mexico but may not seize them."
more_quotes = [
  "The standstill is put in writing until Washington replies, and Stockton adheres for the squadron.",
  "Polk orders his commodore to observe the Cahuenga arrangements and sends Stevenson's New York regiment, already at sea for San Francisco, on to Mazatlán and La Paz. He calls it a suspension.",
]
open = "Put in writing at Cahuenga (1847, PROPOSED) 'until Washington replies'; whether the 1848 Buchanan–Vallejo Convention supersedes it is not stated."

[[commitment]]
id = "C-1847-CAHUENGA"
name = "Cahuenga terms"
kind = "convention"
parties = ["PAC", "US"]
from = 1847
owes = [
  { by = "PAC", to = "US", what = "Frémont's battalion leaves the country; Kearny's paroled survivors embark at San Diego; amnesty for Bear Flag men who are American citizens" },
  { by = "US", to = "PAC", what = "the naval standstill, in writing, until Washington replies; Stockton adheres for the squadron" },
  { by = "PAC", to = "US", what = "exchange of prisoners" },
]
conditions = ["Frémont signs on his own authority, cut off; Kearny does not accept it"]
status = "PROPOSED"
cr = "CR-028"
section = 4
quote = "At Cahuenga on 13 January 1847, Frémont, cut off and acting on his own authority, signs terms with Andrés Pico to get his battalion out of the country."
more_quotes = [
  "Kearny's paroled survivors embark at San Diego, prisoners are exchanged, and Bear Flag men who are American citizens receive an amnesty that Californios who lost men at Olompali do not forgive.",
  "The Mormon Battalion, arriving at San Diego after San Pasqual, is interned under the Cahuenga terms and then released to march to the Salt Lake; some of its men work a season at Carquinez first.",
  "Polk orders his commodore to observe the Cahuenga arrangements",
]
open = "Ends 'until Washington replies'; no year of ending stated. The 1848 convention closes 'the claims of 1846 by amnesty and a mixed commission' but is not said to replace Cahuenga."

