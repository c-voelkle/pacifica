  { by = "ESTATES", to = "CROWN", what = "accept Victoria's regency and her adopted son as successor" },
  { by = "CROWN", to = "INLAND", what = "life offices for the named holders; the factions meet through the Crown" },
]
conditions = [
  "Silas's inland command sits at Sacramento, Kiyoshi's naval party at Pearl Harbor, Soberanes's Polytechnic at Carquinez; Victoria holds Thalassia and Honolulu.",
