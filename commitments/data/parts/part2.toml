  "Negotiations take place in Hawaii during 1886–1887 and the Truce of Thalassia is signed in spring 1887 while Elias lives.",
  "Victoria’s adopted infant son is their acceptable successor, and she becomes regent without a war of inheritance.",
  "The negotiated pact takes effect; the empire consolidates without a succession war.",
  "The Truce supplies a governing balance through the life offices and Regency Council.",
]
open = "The signing in spring 1887 is **[PROPOSED]**; the terms paragraph is unlabelled. When and by what act its terms become organic law is not stated."

