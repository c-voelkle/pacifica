# ---------------------------------------------------------------------------
# §21 The Constitution of the Realm
# ---------------------------------------------------------------------------

[[commitment]]
id = "C-1887-CONSTITUTION"
name = "Constitution of the Realm"
kind = "constitution"
parties = ["PAC", "CROWN", "COUNTIES", "ESTATES", "HI"]
from = 1887
owes = [
  { by = "PAC", to = "HI", what = "entrenched language and tenure guarantees for Hawaii as a historic land (no veto)" },
  { by = "PAC", to = "COUNTIES", what = "land taxes, roads, sanitation, primary schools and ordinary policing left to county boards" },
]
conditions = [
  "Abolishes the states; 124 counties; residual powers belong to the Realm.",
  "A Commissioner never serves in his home county, rotates at least every five years and may suspend a county act for thirty days for the Court's review.",
  "No county may borrow abroad; domestic borrowing needs Treasury consent.",
  "Ministers answer to the ruler, not the Chamber.",
]
status = "CANON"
section = 21
quote = "The Constitution of the Realm of 1887 abolishes the states and draws 124 counties across their old boundaries, dividing Deseret among several of them."
more_quotes = [
  "California and Hawaii remain historic lands with entrenched language and tenure guarantees, not sovereign members with vetoes.",
  "The constitution follows amendment procedure in form, with two-thirds of both chambers and founding-state ratification.",
  "He never serves in his home county, rotates at least every five years and may suspend a county act for thirty days for the Court's review. No county may borrow abroad; domestic borrowing needs Treasury consent.",
  "The ruler appoints and dismisses ministers; they answer to the ruler, not the Chamber.",
]
open = "Its own amendment procedure is not stated. Hawaii's assent came from the illegal Territorial Council; Hawaiian loyalists reject it."

