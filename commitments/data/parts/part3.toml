[[commitment]]
id = "C-1888-FRANCHISE"
name = "Franchise Law of 1888"
kind = "law"
parties = ["PAC"]
from = 1888
conditions = [
  "each adult citizen one ordinary vote, a second for the civil examination and a third for a degree, commission or Polytechnic diploma",
  "each certified language beyond English on the Crown's list adds a tongue vote; tongue votes are uncapped",
  "referendums remain restricted to examined citizens",
]
status = "CANON"
section = 25
quote = "The 1888 Franchise Law gives each adult citizen one ordinary vote, a second for the civil examination and a third for a degree, commission or Polytechnic diploma."
more_quotes = [
  "Each certified language beyond English on the Crown’s list adds a tongue vote. Tongue votes are uncapped. Referendums remain restricted to examined citizens.",
]
open = "Amendment procedure and term not stated."

[[commitment]]
id = "C-1888-COUNTY-GRADES"
name = "Earned county autonomy (chartered status, receivership and programme sunset)"
kind = "law"
parties = ["PAC", "COUNTIES"]
from = 1888
owes = [
