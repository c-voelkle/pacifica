  { by = "COUNTIES", to = "PAC", what = "receivership permitted after three years below the standards or declared disorder" },
]
can_end = [
  { who = "PAC", how = "a suspended board stays suspended up to five years, renewable by the Senate" },
  { who = "PAC", how = "county powers, boundaries and grades are organic law, amendable by both chambers without local consent" },
]
conditions = [
  "four standards: infant mortality, examination passes, revenue per head and order",
  "every Realm programme lapses after ten years unless the Office certifies it",
]
status = "CANON"
section = 25
quote = "Five consecutive years at the Office's four standards—infant mortality, examination passes, revenue per head and order—bring chartered status; three years below or declared disorder permit receivership."
more_quotes = [
  "A board can be suspended for up to five years, renewable by the Senate. Measures grants follow results. Every Realm programme lapses after ten years unless the Office certifies it.",
  "County powers, boundaries and grades are organic law, amendable by both chambers without local consent.",
]
open = "Year of enactment not stated; 1888 is the Office of Public Measures' founding year (canon_facts), used as the earliest possible start. Relation to the 1887 Constitution's county articles not stated."

