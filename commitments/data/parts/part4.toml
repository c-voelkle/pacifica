[[commitment]]
id = "C-1914-ENTENTE-LOANS"
name = "Entente loans (wartime advances)"
kind = "loan"
parties = ["PAC", "ENTENTE", "UK", "FR", "RU", "JP", "US"]
from = 1914
owes = [
  { by = "ENTENTE", to = "PAC", what = "repayment of the advances gathered from the Treasury, Pacifican savers and foreign subscriptions through the San Francisco syndicates" },
  { by = "ENTENTE", to = "US", what = "Union investors buying through Pacifican correspondents keep their own claims and their own risk" },
  { by = "ENTENTE", to = "JP", what = "repayment of Japan's lending to the Entente from 1917" },
]
secured_on = "from the end of 1916, the Allies' requisitioned foreign securities, many of them Pacifican bonds (the collateral loans)"
conditions = ["In 1914 Pacifica's own savers carry the loans alone, Washington discouraging loans to belligerents."]
status = "CANON"
cr = "CR-025"
section = 30
quote = "San Francisco syndicates gather the Treasury's money, Pacifican savings and foreign subscriptions into the Entente loans."
more_quotes = [
  "When the Union's banks grow wary of unsecured Entente paper at the end of 1916, loans secured on the Allies' requisitioned foreign securities, many of them Pacifican bonds, help carry the last two years of the war",
  "From 1917 Japan, flush with export earnings, also lends to the Entente.",
  "In autumn 1918 Julian stops the Treasury's lending and the San Francisco syndicates' new issues for the Entente",
  "The peace leaves two financial systems: Union loans in Berlin, Vienna and Germany's eastern clients; Pacifican claims in London, Paris and Asia.",
]
open = "No term, maturity or interest stated. New lending stops in autumn 1918 (PROPOSED), but the debt continues. The fate of Russia's share after Russia's collapse is not stated. Amounts are MODEL (CR-025: $8.5bn advances). Britain's part is funded in 1923 (C-1923-UK-FUNDING); Hoover's 1931 moratorium suspends war debts (C-1931-HOOVER-MORATORIUM)."

