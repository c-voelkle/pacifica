# The homelands of 1887 (CR-071 Part I, I4a): their lines.
# Draft 2, 16 November 2026: the large homelands follow the boundary texts in Royce, Indian Land Cessions in the
# United States (18th Annual Report of the Bureau of American Ethnology, 1899; the author's copy), read in this
# session, where our timeline has such a text; `royce` gives the entry. A ring is longitude/latitude, placed from
# the text's parallels, meridians, rivers and named points; where the text follows a crest or a creek the ring is
# within a few miles, not surveyed. `counties` (+ `box`): the homeland is that part of our timeline's counties of
# 1887, so its edge is a county line. `kind`: large = a unit outside the 124 (I-8, I-26); enclave = inside a county.
# PROPOSED until the author approves each.

[[large]]
name = "Diné country"
basis = "Navajo homeland treaty of 1865 (canon); I-18, I-19"
royce = "none: canon's own treaty. North: the San Juan and the Colorado; west: the Colorado and the Little Colorado to the Peaks; south: north of the thirty-fifth-parallel railway; east: the Chaco country to Mount Taylor"
ring = [[-111.68, 35.36], [-111.62, 36.0], [-111.6, 36.87], [-110.9, 37.18], [-110.2, 37.2], [-109.6, 37.25], [-109.05, 37.2], [-108.6, 36.85], [-108.2, 36.72], [-107.75, 36.15], [-107.55, 35.3], [-107.75, 35.25], [-107.9, 35.6], [-109.05, 35.62], [-110.7, 35.3], [-111.55, 35.3]]
[[large]]
name = "Utes' Slope and Parks"
basis = "Ute agreement of 1866 (canon, CR-060 R4)"
royce = "treaty of 2 March 1868: west of 107 W, from Colorado's south line to 15 miles north of 40 N. Drawn as our timeline's six counties of 1887 on that ground that are in no county of the 124, so the mining counties held on lease (I-34) stay whole"
counties = ["CO;Mesa", "CO;Delta", "CO;Montrose", "CO;Garfield", "CO;Routt", "CO;Grand"]
[[large]]
name = "Nez Perce country"
basis = "Stevens's treaty of 11 June 1855, with the Wallowa; the cession of 1863 is not made. Checked against Royce's text and plate CXXIII (Idaho, nos. 441-442): the east line is a line west of the Bitterroot crest, about 115 deg 33 min W, reaching the Salmon well above the old crossing"
royce = "treaty of 11 June 1855, the reserve: from the south fork of the Palouse to the Snake 10 miles below the Alpowa, the Alpowa's source, the crest of the Blue Mountains, the Grande Ronde, the divide of the Wallowa and the Powder, the Snake 15 miles below the Powder, the Salmon, and the spurs of the Bitterroots"
