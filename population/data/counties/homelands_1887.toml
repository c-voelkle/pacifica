[[large]]
name = "Klamath"
basis = "Pacifica's own compact (Oregon was under its civil compact in 1864)"
royce = "treaty of 14 October 1864, the reserve: from the Point of Rocks on Klamath Lake up the shore and Wood River to Fort Klamath, east past the north end of the upper lake to the mountains, along them to the Sprague, and back by the summit to the Point of Rocks"
