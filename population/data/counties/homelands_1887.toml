basis = "Stevens's treaty of 9 June 1855"
royce = "treaty of 9 June 1855, the reserve: up the Ahtanum from the Yakima to the Cascades, along the main ridge past Mount Adams, the divides of the Klickitat, Pisco and Satus, to the Yakima at the Satus, up the Yakima"
ring = [[-120.47, 46.53], [-121.3, 46.5], [-121.42, 46.25], [-121.2, 46.0], [-120.6, 45.97], [-120.2, 46.05], [-120.05, 46.25], [-120.3, 46.42]]
[[large]]
