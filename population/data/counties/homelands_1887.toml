box = [-110.95, 39.95, -109.78, 41.2]
[[large]]
name = "Apache country"
basis = "the Apache peace of 1865 (canon); the line is given in 1865 (I-52)"
royce = "White Mountain reserve, executive order of 9 November 1871: the south edge of the Black Mesa from New Mexico's line west to a point north of Sombrero Butte, the Apache Mountains and the Salt to Pinal Creek, up it to the Pinal Mountains, then the crests north of the Gila to New Mexico's line near Steeple Rock. Not the San Carlos addition of 1872 (the Gila's valley) and none of the reductions of 1873-77: Globe and Clifton lie inside, on lease"
