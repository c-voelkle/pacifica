extra = [[[-111.32, 36.05], [-111.3, 36.2], [-111.12, 36.2], [-111.12, 36.05]]]
extra_names = ["Moenkopi (Hopi)"]

# California: the tracts reserved by the eighteen treaties of 1851-52 (canon section 8; our timeline's Senate
# rejected them). Royce numbers them 273-309 on his plate "California 1" (pl. CXIV) and gives no boundary text,
# only "reserve a tract on ..."; eighteen treaties, nineteen tracts (the treaties of 30 May and 3 June reserve two
# each; that of 22 August none, its bands going to Clear Lake). Royce prints the dates; the treaty places are from
