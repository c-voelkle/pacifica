# The homelands of 1887 (CR-071 Part I, I4): a first suggestion of their lines, for the author.
# Every ring is a SKETCH in longitude/latitude drawn by the assistant from the treaty or order named in
# `basis`, from memory of those texts; none has been read from Royce's Indian Land Cessions (1899) or its
# digitized maps yet. PROPOSED throughout. `kind`: large = a unit outside the 124 (I-8, I-26); enclave =
# inside a county's lines, beyond its board's reach.

