counties = ["AZ;Gila", "AZ;Graham", "AZ;Apache"]  # the west and east edges are our timeline's county lines (the Salt and Pinal Creek side; New Mexico's line)
[[large]]
name = "Chiricahua"
basis = "the peace of 1865 with Cochise (canon)"
royce = "executive order of 14 December 1872: from Dragoon Springs along the north base of the Chiricahua Mountains to the Peloncillo summit, to New Mexico's line, south to Mexico, west 56 miles, north along the west base of the Dragoons"
ring = [[-110.03, 32.03], [-109.5, 32.2], [-109.05, 32.3], [-109.05, 31.33], [-110.0, 31.33]]
[[large]]
name = "Tohono O'odham"
basis = "Pacifica's own compact, to be dated; no treaty in our timeline"
royce = "none before 1874 (San Xavier). Drawn as our timeline's Pima County west of the Baboquivari crest, so that Tucson's county is one piece"
counties = ["AZ;Pima"]
box = [-113.5, 31.2, -111.6, 32.6]

[[large]]
name = "Hopi"
inside = "Diné country"
basis = "HP1-HP7 (I-20): the mesas' country by named places, with Moenkopi as a detached part"
royce = "our timeline's order of 16 December 1882 drew a box of degrees (110 to 111 W, 35 30 to 36 30 N); HP2 refuses that. Sketched instead by places: Dinnebito Wash on the west, Black Mesa's rim on the north, Keams Canyon on the east, the Hopi Buttes on the south. A sketch, to be settled with the villages' own names"
