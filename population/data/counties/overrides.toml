# Figures the county articles did not give, and how each was obtained. All MODEL inputs to a
# historical baseline (our timeline), not canon.

[residual_1880]
# state total (census.toml, verified) minus the sum of the other counties: exact when one county is missing
"CA;San Francisco" = 233959
"ID;Alturas" = 1693
"UT;Cache" = 12562
"NV;Ormsby" = 5698   # Ormsby with Roop County (attached to Washoe in 1883); the two are not separated here

[unverified_1890]
# 1890 state totals include Indians on reservations, so a residual does not isolate one county.
# These are the figures the residuals are consistent with; each is to be read from the 1890 census
# (Compendium, Part I, Table 2) before it is cited anywhere.
"CA;San Francisco" = 298997   # CA residual 317,854 = this + Orange 13,589 + 5,268
"NV;Ormsby" = 4883            # NV residual 6,477 = this + 1,594
"ID;Alturas" = 6798           # Alturas with Logan (created from it in 1889); ID residual leaves 4,469 beyond it

