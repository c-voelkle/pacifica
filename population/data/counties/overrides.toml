[islands]
# Hawaii has no counties before 1905. Kingdom censuses by island; each row sums exactly to the
# verified total in census.toml (80,578 and 89,990), so status is identity-checked; to be read from
# Schmitt, Demographic Statistics of Hawaii (1968), Table 16.
