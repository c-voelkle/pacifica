# The provisioning account (CR-082): people against the food the domain can grow.
# Used by provisioning.py. History's acreages are our timeline's census figures;
# every factor that turns acres into mouths is MODEL and is a lever.

[author]
# Author's decisions, 21 November 2026, 17:59.
diet = "the Realm's present diet, held constant"
growth = "slower than in the early years"
crown = "the Philippine crown is counted after Julian's accession"

# ---------------------------------------------------------------------------
# Irrigated area, our timeline
# ---------------------------------------------------------------------------

