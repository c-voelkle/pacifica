# ---------------------------------------------------------------------------
# Levers (MODEL)
# ---------------------------------------------------------------------------

[levers]
# Crop land needed per head on the Realm's diet, in acres of average Union crop land.
# Our timeline: crop land used for the Union's own food, fibre and tobacco (harvest,
# failure and fallow; horse feed and exports left out) was 2.14 acres a head in 1910-14
# and about 2.1-2.3 in 1925-34 (252m acres for about 119m people in 1925-29).
acres_per_head = 2.1
acres_per_head_source = "Table 'Cropland acreage used for various purposes, 1910-50' (collections.lib.utah.edu/details?id=1134612; the report's title to verify)"
acres_per_head_status = "verified for 1910-14 (2.14); later periods computed from the table's totals"
union_cropland_1925_29 = 374000000   # the same table: all crop land, harvest, failure and fallow
# One irrigated acre and one dry western acre, in acres of average Union crop land.
irrigated_factor = 2.0
dry_factor = 0.8
factor_status = "MODEL (no source). Generous to the West: much irrigated land grew hay."
# Canon's farmers can dry-farm this multiple of our timeline's 1929 dry crop land, and no more.
dry_ceiling_factor = 1.2
# The Office's assumed course: the yearly rate falls in a straight line from the
# last decade's rate to g_end over a century. 0.015 puts the table of 1930 at about
# half a billion a century on, the author's premise (17:09).
g_end = 0.015
horizon = 100
# Author, 21 November 2026, 18:52: Julian is a provisioner and means to bring more
# people under his umbrella, so under him the Office assumes less slowing, "at least
# for the time being". The tables made in his reign (from 1908) end at this rate.
# The value is the script's reading of "less slowing"; the author has not fixed it.
g_end_julian = 0.020
julian_from = 1908
# Ceiling on irrigated area in the territory: the 1940 census's irrigable area in
# enterprises, times the territory's share of the 1929 irrigated area.
ceiling_basis = "irrigable_in_enterprises_1940"

