[territory]
# Share of each state's irrigated and dry crop land inside Pacifica (MODEL).
# Whole states: California, Oregon, Washington (Columbia), Idaho, Nevada (Washoe),
# Utah (Deseret), Arizona, New Mexico. Part states by canon's frontier:
# Colorado west of the plains (the Western Slope and the San Luis Valley),
# western Montana with Three Forks, southwest Wyoming.
irrigated = {Colorado = 0.43, Montana = 0.45, Wyoming = 0.27}
dry = {Colorado = 0.10, Montana = 0.15, Wyoming = 0.10}
population = {Colorado = 0.17, Montana = 0.45, Wyoming = 0.20}
status = "estimate; to replace with county figures on the 1887 map (population/data/counties)"

[dry_cropland]
# Dry crop land in the territory as a share of its 1929 level. No census series read.
years = [1861, 1869, 1879, 1889, 1899, 1909, 1919, 1929]
index = [0.06, 0.15, 0.38, 0.60, 0.75, 0.90, 1.00, 1.00]
status = "estimate (no source; shaped on California's wheat acreage, which peaked about 1888); to replace with the Census of Agriculture's improved-land series"

# ---------------------------------------------------------------------------
# Levers (MODEL)
# ---------------------------------------------------------------------------

[levers]
# Crop land needed per head on the Realm's diet, in acres of average Union crop land.
# Our timeline: crop land used for the Union's own food, fibre and tobacco (harvest,
# failure and fallow; horse feed and exports left out) was 2.14 acres a head in 1910-14
# and about 2.1-2.3 in 1925-34 (252m acres for about 119m people in 1925-29).
acres_per_head = 2.1
acres_per_head_source = "Table 'Cropland acreage used for various purposes, 1910-50' (collections.lib.utah.edu/details?id=1134612; the report's title to verify)"
acres_per_head_status = "verified for 1910-14 (2.14); later periods computed from the table's totals"
union_cropland_1925_29 = 374000000   # the same table: all crop land, harvest, failure and fallow
# One irrigated acre and one dry western acre, in acres of average Union crop land.
irrigated_factor = 2.0
dry_factor = 0.8
factor_status = "MODEL (no source). Generous to the West: much irrigated land grew hay."
# Canon's farmers can dry-farm this multiple of our timeline's 1929 dry crop land, and no more.
dry_ceiling_factor = 1.2
# The Office's assumed course: the yearly rate falls in a straight line from the
# last decade's rate to g_end over a century. 0.015 puts the table of 1930 at about
# half a billion a century on, the author's premise (17:09).
g_end = 0.015
horizon = 100
# Ceiling on irrigated area in the territory: the 1940 census's irrigable area in
# enterprises, times the territory's share of the 1929 irrigated area.
ceiling_basis = "irrigable_in_enterprises_1940"

[crown]
# The Philippine crown, counted from the year after Julian's oath at Manila (December 1907).
from_year = 1908
census_years = [1903, 1918, 1939]
census = [7635426, 10314310, 16000303]
census_source = "Philippine censuses of 1903, 1918 and 1939, via Wikipedia 'Census in the Philippines'"
census_status = "verified (our timeline; canon's Philippine population is not modelled)"
cultivated_years = [1903, 1935]
cultivated_hectares = [1300000, 4000000]
cultivated_source = "Library of Congress Country Study, Philippines, 'Economic and Social Developments' (countrystudies.us/philippines/19.htm)"
cultivated_status = "verified as quoted; rounded figures"
export_crop_share = 0.30       # sugar, coconut, abaca: MODEL
acres_per_head = 0.50          # the crown's own rice diet, in its own acres: MODEL, set so that
                               # it buys about a tenth of its food abroad, as in our timeline (to verify)
status = "MODEL: the crown is kept as its own ledger, on its own diet and its own land"

# ---------------------------------------------------------------------------
# Yields under concerted research (the central case)
# ---------------------------------------------------------------------------

[yield_ladder]
# All wheat, Washington: yield per harvested acre (bushels), 1895-1975. Washington's
# wheat is overwhelmingly dry-farmed, so this is what the same dry land gave in our
# timeline as varieties, fertilizer and tillage improved.
first_year = 1895
bushels = [15.5, 15.0, 20.0, 20.5, 19.5,
           19.8, 24.6, 19.9, 16.6, 19.4, 20.5, 18.5, 23.2, 14.6, 19.3,
           15.0, 19.9, 20.1, 19.7, 21.4, 23.5, 20.4, 14.1, 12.5, 16.8,
           17.2, 23.2, 13.6, 25.3, 14.1, 17.5, 19.1, 24.6, 21.4, 18.6,
           16.1, 18.0, 18.6, 20.2, 19.2, 22.5, 21.5, 21.2, 24.0, 22.4,
           20.7, 29.1, 31.0, 26.2, 26.8, 24.4, 29.5, 23.8, 28.7, 21.8,
           26.6, 27.5, 27.9, 28.6, 32.2, 27.9, 29.5, 38.3, 34.9, 38.4,
           33.4, 28.0, 39.4, 37.4, 39.5, 39.2, 40.0, 39.9, 38.6, 38.4,
           44.0, 48.7, 47.4, 32.8, 39.5, 48.3]
source = "USDA NASS, Washington Field Office, 'All wheat, Washington: acreage, yield and production' (data.nass.usda.gov, Historic_Data/smallgrains/allwheat.pdf)"
status = "verified (read 21 November 2026)"
base_years = [1900, 1929]      # our timeline's flat years: the measure of 'history's yields'
# The rule: in year t the Realm farms as our timeline farmed the same land in year
# t + lead. The lead grows in a straight line from nothing in lead_from to lead_max
# in lead_full and holds. Our timeline's dry-farm research begins with Utah's Nephi
# substation in 1903 and its gains reach the fields from the 1940s; canon's Colegio
# de Santa Fe teaches dry-land farming from 1864 (CR-036 D13) and Deseret's
# university measures water (D14), a generation and more earlier.
lead_from = 1880
lead_full = 1930
lead_max = 30
lead_status = "MODEL: the one judgement in the central case. Sensitivity in the report."
applies_to_irrigated = true
irrigated_status = "the same ladder is applied to irrigated land for want of a verified irrigated series; to replace (Idaho or California yields)"

[nitrogen]
# What the central case's yields ask of nitrogen, and what canon makes.
grain_per_standard_acre = 0.5     # tonnes of grain or its equivalent on an average Union acre: MODEL
grain_per_tonne_n = 25            # canon's own figure (finance/CR-056-dynamics-workbook.md, C4)
canon_total_1929 = 90000          # tonnes of nitrogen, CR-054 (MODEL)
canon_farm_share = 0.5            # CR-056 C4: half goes to farms
canon_from = 1915                 # ammonia on the Columbia from 1915 (CR-055)
nitrogen_share_of_gain = 0.5      # the part of the yield gain that has to be bought with nitrogen: MODEL
status = "MODEL; the response and the share are to verify against our timeline's fertilizer use on western wheat in 1950-65"

