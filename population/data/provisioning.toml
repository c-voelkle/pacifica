status = "verified for 1889, 1899, 1919, 1929; the 1909 figure's middle digits are unclear in the scan (14,433,285 or 14,455,285)"
# Before the first irrigation census: no count. Rough guesses to start the series.
early_years = [1861, 1869, 1879]
early_acres = [100000, 300000, 1000000]
early_status = "estimate (no source)"
# Irrigable area in enterprises, 19 states, Census of 1940: the period's own ceiling.
irrigable_in_enterprises_1940 = 31305949
works_capable_1940 = 26055248
ceiling_source = "Census of Irrigation 1940, Summary for the 17 Western States, Table 3"
ceiling_status = "verified"

[irrigation_1929]
# Area irrigated in 1929, by state (acres).
California = 4746632
Idaho = 2181250
Utah = 1324125
Oregon = 898713
Arizona = 575590
